name: Codex - desarrollo autónomo (opt-in)

# DESHABILITADO POR DECISIÓN DEL USUARIO: no usar API con cobro separado.
# No hay ejecuciones programadas. Ni siquiera la activación manual ejecuta
# jobs mientras el bloqueo explícito de preflight siga vigente.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-desarrollo-autonomo
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ false }} # API de pago deshabilitada explícitamente
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}
      no_pending_pr: ${{ steps.pending.outputs.no_pending_pr }}
    steps:
      - name: Verificar credencial sin imprimirla
        id: key
        shell: bash
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "$CODEX_API_KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Codex omitido: falta el secret OPENAI_API_KEY.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Evitar generar PRs acumulados sin revisión
        id: pending
        if: steps.key.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("codex/auto-"))] | length')"
          if [[ "$count" -gt 0 ]]; then
            echo 'no_pending_pr=false' >> "$GITHUB_OUTPUT"
            echo 'Codex omitido: hay una propuesta autónoma pendiente de revisar.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'no_pending_pr=true' >> "$GITHUB_OUTPUT"
          fi

  implementar:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true' && needs.preflight.outputs.no_pending_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Obtener código fuente sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias fijadas
        run: python -m pip install -r requirements-dev.txt
      - name: Ejecutar una mejora autónoma con Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/desarrollo-autonomo.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          output-file: codex-resumen.md
      - name: Validar código modificado sin acceso de escritura a GitHub
        shell: bash
        run: |
          python -m pip check
          python -m compileall -q trading_ia tests backtesting_v3_1.py
          python -m pytest -q
      - name: Preparar parche limitado a código, tests y documentación
        id: diff
        shell: bash
        run: |
          git add -A -- trading_ia tests docs
          git diff --cached --binary -- trading_ia tests docs > codex-autonomo.patch
          if [[ -s codex-autonomo.patch ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Sin cambios para proponer en esta ejecución.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar cambios auditables
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-cambios
          path: |
            codex-autonomo.patch
            codex-resumen.md
          retention-days: 7

  proponer:
    needs: implementar
    if: needs.implementar.result == 'success' && needs.implementar.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: codex-cambios
      - name: Aplicar únicamente el parche validado
        shell: bash
        run: |
          git apply --check --index codex-autonomo.patch
          git apply --index codex-autonomo.patch
          invalid="$(git diff --cached --name-only | grep -Ev '^(trading_ia/|tests/|docs/)' || true)"
          if [[ -n "$invalid" ]]; then
            echo "Rutas no autorizadas: $invalid" >&2
            exit 1
          fi
      - name: Publicar rama nueva sin ejecutar el código generado
        shell: bash
        run: |
          branch="codex/auto-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore(codex): propuesta autónoma verificada en runner"
          git push origin "$branch"
          echo "CODEX_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Crear Pull Request para revisión
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$CODEX_BRANCH" \
            --title "Codex: mejora autónoma #${{ github.run_number }}" \
            --body "Propuesta generada en un job sin permiso de escritura a GitHub. Se validó pip check, compileall y pytest antes de trasladar únicamente el parche de trading_ia/, tests/ y docs/. Requiere revisión del diff y CI antes de fusionar. No implica trading real ni rentabilidad."
          # Las acciones realizadas con GITHUB_TOKEN no disparan siempre los
          # workflows por pull_request. Cuando exista CI, lanzarla explícitamente.
          if gh workflow view validacion.yml >/dev/null 2>&1; then
            gh workflow run validacion.yml --ref "$CODEX_BRANCH"
          fi
